name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build (for example v2.2.0)'
        required: true
        default: 'v2.3.0'
        type: string
      publish_release:
        description: 'Publish application assets after the Windows build succeeds'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_xinputbridge.py
      - name: Bundle forwarding runtime and verified driver installers
        shell: pwsh
        run: ./scripts/build-windows-runtime.ps1
      - name: Package Windows application
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        run: npm run dist -- --publish always
      - name: Verify Windows application without publishing
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Artifacts publish via electron-builder's `publish` config in
      # package.json (both exes land on the Release). Tag must match the
      # package.json version, e.g. tag v1.0.0 with version 1.0.0.
